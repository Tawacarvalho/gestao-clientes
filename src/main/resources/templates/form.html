<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0 fs-4">Registar / Editar Cliente</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row mb-3">
                    <div class="col-12 col-md-6 mb-3 mb-md-0">
                        <label class="form-label">Nome Completo:</label>
                        <input type="text" th:field="*{nome}" class="form-control" required />
                    </div>
                    <div class="col-12 col-md-3 mb-3 mb-md-0">
                        <label class="form-label">CPF:</label>
                        <input type="text" th:field="*{cpf}" class="form-control" required />
                    </div>
                    <div class="col-12 col-md-3">
                        <label class="form-label">Telefone:</label>
                        <input type="text" th:field="*{telefone}" class="form-control" required />
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-12 col-md-3 mb-3 mb-md-0">
                        <label class="form-label">CEP:</label>
                        <input type="text" th:field="*{cep}" id="cep" class="form-control" placeholder="Apenas números" required />
                    </div>
                    <div class="col-12 col-md-7 mb-3 mb-md-0">
                        <label class="form-label">Morada (Logradouro):</label>
                        <input type="text" th:field="*{endereco}" id="endereco" class="form-control" required />
                    </div>
                    <div class="col-12 col-md-2">
                        <label class="form-label">Número:</label>
                        <input type="text" th:field="*{numero}" class="form-control" required />
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-12 col-md-4 mb-3 mb-md-0">
                        <label class="form-label">Bairro:</label>
                        <input type="text" th:field="*{bairro}" id="bairro" class="form-control" required />
                    </div>
                    <div class="col-12 col-md-4 mb-3 mb-md-0">
                        <label class="form-label">Cidade:</label>
                        <input type="text" th:field="*{cidade}" id="cidade" class="form-control" required />
                    </div>
                    <div class="col-12 col-md-2 mb-3 mb-md-0">
                        <label class="form-label">Estado (UF):</label>
                        <input type="text" th:field="*{estado}" id="estado" class="form-control" required />
                    </div>
                    <div class="col-12 col-md-2">
                        <label class="form-label">Complemento:</label>
                        <input type="text" th:field="*{complemento}" class="form-control" />
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Guardar</button>
                    <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Script JavaScript para preencher o endereço automaticamente pelo CEP -->
<script>
    document.getElementById('cep').addEventListener('blur', function() {
        let cep = this.value.replace(/\D/g, '');
        if (cep.length === 8) {
            fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(response => response.json())
                .then(data => {
                    if (!data.erro) {
                        document.getElementById('endereco').value = data.logradouro;
                        document.getElementById('bairro').value = data.bairro;
                        document.getElementById('cidade').value = data.localidade;
                        document.getElementById('estado').value = data.uf;
                    } else {
                        alert('CEP não encontrado.');
                    }
                })
                .catch(error => console.error('Erro ao buscar o CEP:', error));
        }
    });
</script>
</body>
</html>
