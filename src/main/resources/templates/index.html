<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
    <!-- Cabeçalho responsivo -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <h2>Lista de Clientes</h2>
        <a th:href="@{/clientes/novo}" class="btn btn-primary">Novo Cliente</a>
    </div>

    <!-- Formulário de Filtros -->
    <div class="card shadow mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/clientes}" class="row g-3">
                <div class="col-12 col-md-5">
                    <label class="form-label">Filtrar por Nome:</label>
                    <input type="text" name="nome" th:value="${nome}" class="form-control" placeholder="Digite o nome..." />
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Filtrar por CPF:</label>
                    <input type="text" name="cpf" th:value="${cpf}" class="form-control" placeholder="Digite o CPF..." />
                </div>
                <div class="col-12 col-md-3 d-flex align-items-end gap-2">
                    <button type="submit" class="btn btn-dark w-100">Pesquisar</button>
                    <a th:href="@{/clientes}" class="btn btn-secondary w-100">Limpar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela Centralizada com Margens -->
    <div class="card shadow">
        <div class="card-body p-3">
            <div class="table-responsive">
                <table class="table table-striped table-sm align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Nome Cliente</th>
                        <th class="d-none d-md-table-cell">CPF</th>
                        <th class="d-none d-md-table-cell">Telefone</th>
                        <th>Endereço Completo</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cliente : ${clientes}" th:if="${cliente.ativo}">
                        <td>
                            <span class="fw-bold" th:text="${cliente.nome}"></span>
                            <div class="d-block d-md-none text-muted small">
                                <span th:text="'CPF: ' + ${cliente.cpf}"></span> |
                                <span th:text="'Tel: ' + ${cliente.telefone}"></span>
                            </div>
                        </td>
                        <td class="d-none d-md-table-cell" th:text="${cliente.cpf}"></td>
                        <td class="d-none d-md-table-cell" th:text="${cliente.telefone}"></td>
                        <td>
                            <span th:text="${cliente.endereco + ', ' + cliente.numero + ' - ' + cliente.bairro + ', ' + cliente.cidade + '/' + cliente.estado}"></span>
                            <span th:if="${cliente.complemento != null and !cliente.complemento.isEmpty()}"
                                  th:text="${' (' + cliente.complemento + ')'}" class="text-muted"></span>
                        </td>
                        <td class="text-end">
                            <div class="d-flex flex-wrap justify-content-end gap-1">
                                <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-warning btn-sm text-center" style="width: 85px;">Editar</a>
                                <a th:href="@{/clientes/excluir/{id}(id=${cliente.id})}" class="btn btn-danger btn-sm text-center" style="width: 85px;" onclick="return confirm('Deseja inativar este cliente?')">Inativar</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
